name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Compile Production Web Asset
        run: npm run build

      - name: Inject Native Android Container
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap integrity-check || true
          npx cap add android --no-sync || true

      - name: Fetch and Configure Custom Cat Branding
        run: |
          curl -L -o icon.png "https://unsplash.com"
          curl -L -o splash.png "https://unsplash.com"
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android || true

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Build & Assets to Android Wrapper
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPaws-Mobile-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
